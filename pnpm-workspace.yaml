allowBuilds:
  esbuild: true
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
# Audit DB matches version range only; our patch remediates GHSA-gcqx-w48m-w2h4
# (no npm release >=4.3.2 exists). Remove ignore when upstream publishes a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
minimumReleaseAgeExclude:
  - minimatch@11.0.1
  - glob@14.0.2
